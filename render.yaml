databases:
  - name: agroandes-db
    plan: free
    databaseName: agroandes
    user: agroandes

services:
  - type: web
    name: agroandes
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agroandes-db
          property: connectionString
